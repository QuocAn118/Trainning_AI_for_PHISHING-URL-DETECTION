<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra URL Phishing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            padding: 40px;
            width: 100%;
            max-width: 560px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 28px;
        }
        form { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
        }
        input[type="text"]:focus { border-color: #667eea; }
        button {
            padding: 14px 24px;
            background: #667eea;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #5568d3; }
        .result {
            margin-top: 28px;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }
        .result.safe   { background: #e6f9ed; border: 2px solid #34c759; }
        .result.danger { background: #fdeaea; border: 2px solid #e53935; }
        .result .label {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .result.safe   .label { color: #1e8e3e; }
        .result.danger .label { color: #c62828; }
        .result .score { font-size: 15px; color: #555; }
        .result .checked-url {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔍 Kiểm tra URL an toàn</h1>
        <p class="subtitle">Nhập một liên kết để kiểm tra xem có phải phishing hay không (mô hình XGBoost)</p>

        <form method="POST" action="/">
            <input type="text" name="url" placeholder="https://example.com" value="{{ url }}" required>
            <button type="submit">Kiểm tra</button>
        </form>

        {% if result %}
        <div class="result {{ 'safe' if result.safe else 'danger' }}">
            <div class="label">
                {{ '✅' if result.safe else '⚠️' }} {{ result.label }}
            </div>
            <div class="score">
                Độ tin cậy: <strong>{{ result.score }}%</strong>
            </div>
            <div class="checked-url">URL đã kiểm tra: {{ url }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
